server {
    listen 8080;
    root /usr/share/nginx/html;
    client_max_body_size 256k;

    # API and MCP go to the backend; agent calls can take a while.
    location /api/ { proxy_pass http://backend:8080; proxy_read_timeout 180s; }
    location /mcp  { proxy_pass http://backend:8080; proxy_read_timeout 180s; }
    location = /health { proxy_pass http://backend:8080; }
    location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
    location / { try_files $uri /index.html; }
}
